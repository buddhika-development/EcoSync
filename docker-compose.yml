services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    networks:
      - ecosync-network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
    depends_on:
      - server
    networks:
      - ecosync-network

networks:
  ecosync-network:
    driver: bridge